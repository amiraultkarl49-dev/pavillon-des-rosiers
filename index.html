<!doctype html>
<html lang="fr">
<head>

<title>Pavillon des Rosiers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: velvet-curtain gala site. Oxblood night, champagne gold, ivory text. Sticky masthead, one page at a time, ornamental dividers. */
:root {
  --bg: #130810; --panel: #1E0F1B; --panel2: #29152A; --line: #4B2B3E;
  --fg: #F4EADD; --muted: #BDA7B1; --gold: #E5C27D; --gold2: #A9854A; --rose: #EA86A2; --wine: #5A1530;
  --display: "Cormorant Garamond", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.7; font-weight: 300; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
/* velvet curtains on both sides, wide screens only */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  repeating-linear-gradient(90deg, rgba(90,21,48,0.55) 0 14px, rgba(60,12,32,0.55) 14px 28px) left top / 12vw 100% no-repeat,
  repeating-linear-gradient(90deg, rgba(60,12,32,0.55) 0 14px, rgba(90,21,48,0.55) 14px 28px) right top / 12vw 100% no-repeat;
  -webkit-mask-image: linear-gradient(90deg, #000, transparent 11vw, transparent calc(100% - 11vw), #000); mask-image: linear-gradient(90deg, #000, transparent 11vw, transparent calc(100% - 11vw), #000); opacity: 0.55; }
@media (max-width: 70rem) { body::after { display: none; } }
a { color: var(--gold); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.wrap { max-width: 1040px; margin-inline: auto; }

.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--gold2); box-shadow: 0 3px 0 var(--bg), 0 4px 0 var(--line); }
.mast-in { display: flex; align-items: center; gap: 4px 22px; flex-wrap: wrap; padding-top: 10px; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg); }
.logo svg { width: 40px; height: 40px; flex: none; }
.logo span { font-family: var(--display); font-size: 1.7rem; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.nav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 100%; min-width: 0; }
.nav a { flex: none; padding: 9px 8px 8px; text-decoration: none; color: var(--muted); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav a:hover { color: var(--fg); }
button.top { background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font: inherit; padding: 9px 8px 8px; color: var(--muted); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
button.top::after { content: ""; display: inline-block; margin-left: 7px; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
button.top:hover, .grp.open button.top { color: var(--fg); }
button.top.here { color: var(--gold); border-bottom-color: var(--gold); }
.grp { position: relative; }
.sub { display: none; position: absolute; top: 100%; left: 0; min-width: 14rem; background: var(--panel); border: 1px solid var(--gold2); z-index: 25; padding: 6px 0; box-shadow: 0 14px 30px rgba(0,0,0,0.5); }
.sub.r { left: auto; right: 0; }
.grp.open .sub { display: block; }
.sub a { display: block; padding: 11px 18px; border: 0; letter-spacing: 0.08em; }
.sub a:hover { background: var(--panel2); color: var(--fg); }
.sub a[aria-current="page"] { color: var(--gold); border: 0; }
.nav a[aria-current="page"] { color: var(--gold); border-bottom-color: var(--gold); }

main { padding-top: 36px; min-height: 60vh; }
@media (prefers-reduced-motion: no-preference) { main > * { animation: rise 0.45s ease both; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } } }
.eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(3rem, 11vw, 6rem); letter-spacing: 0.01em; line-height: 0.98; }
h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.05; }
h3 { font-size: 1.55rem; line-height: 1.2; }
.lede { font-size: 1.15rem; max-width: 40rem; text-wrap: pretty; margin: 14px 0 0; }
p { margin: 0 0 14px; max-width: 40rem; text-wrap: pretty; }
.muted { color: var(--muted); }
.orn { display: flex; align-items: center; gap: 14px; margin: 26px 0 30px; color: var(--gold2); }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold2)); }
.orn::after { background: linear-gradient(270deg, transparent, var(--gold2)); }
.orn i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--gold); display: block; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.card { position: relative; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); padding: 22px; min-width: 0; }
.card::before, .card::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--gold2); pointer-events: none; }
.card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.card::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.card p:last-child { margin-bottom: 0; }
a.card { display: block; text-decoration: none; color: var(--fg); }
a.card:hover { border-color: var(--gold2); }
.k { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.card h3 { margin-bottom: 8px; }
.quote { border-left: 2px solid var(--gold); padding: 4px 0 4px 20px; font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 4.5vw, 2.3rem); line-height: 1.25; max-width: 38rem; margin: 0; }
.quote small { display: block; margin-top: 10px; font-family: var(--body); font-style: normal; font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.notice { border: 1px solid var(--rose); background: color-mix(in srgb, var(--rose) 9%, var(--bg)); padding: 14px 18px; max-width: 40rem; }
.notice p { margin: 0; }
.sech { margin: 40px 0 16px; }

/* hero */
.hero { position: relative; text-align: center; padding: 30px 0 30px; overflow: hidden; }
.hero-mask { width: min(170px, 42vw); margin: 0 auto 6px; display: block; filter: drop-shadow(0 6px 24px rgba(229,194,125,0.25)); }
.hero .lede { margin-inline: auto; }
.hero .notice { margin: 22px auto 0; text-align: left; }
.count { display: flex; justify-content: center; gap: 12px; margin: 28px 0 8px; }
.count div { min-width: 4.6rem; padding: 12px 8px 10px; border: 1px solid var(--gold2); background: rgba(19,8,16,0.85); }
.count b { display: block; font-family: var(--display); font-size: 2.7rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 600; }
.count span { font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.when { font-size: 0.875rem; letter-spacing: 0.1em; color: var(--muted); }

.facts { display: grid; margin: 0; }
.facts div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); padding-top: 3px; }
.facts dd { margin: 0; min-width: 0; }
.two { display: grid; gap: 28px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 52rem) { .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 30rem) { .facts div { grid-template-columns: 1fr; gap: 0; } }

.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 5.6rem 1fr; gap: 6px 22px; padding: 18px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .y { font-family: var(--display); font-size: 2.3rem; font-weight: 600; line-height: 1; color: var(--gold); }
.tl h3 { font-size: 1.45rem; margin-bottom: 4px; }
.tl p { margin: 0; color: var(--muted); }
.tl .meta { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold2); margin-top: 6px; }
.tl li.last .y, .tl li.last h3 { color: var(--rose); }
@media (max-width: 30rem) { .tl li { grid-template-columns: 1fr; } }

.stat .n { font-family: var(--display); font-size: 3rem; font-weight: 600; color: var(--gold); line-height: 1.05; }
.stat p { color: var(--muted); margin-top: 6px; font-size: 0.9375rem; }
.clip { border: 1px solid var(--line); background: var(--panel); padding: 18px 20px; }
.clip .src { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.clip h3 { font-size: 1.35rem; margin: 6px 0; }
.clip p { margin: 0; font-style: italic; }

.guest { display: grid; grid-template-columns: 72px 1fr; gap: 6px 16px; align-items: start; }
.guest svg, .mk-card svg { overflow: visible; }
.guest svg { width: 72px; height: 72px; }
.guest .nm { font-family: var(--display); font-weight: 600; font-size: 1.7rem; line-height: 1.1; }
.guest .mk { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.guest p { grid-column: 1 / -1; margin: 6px 0 0; color: var(--muted); font-size: 0.9375rem; }
.guest .since { grid-column: 1 / -1; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold2); margin-top: 4px; }
.mk-card { text-align: center; }
.mk-card svg { width: 110px; height: 110px; margin-bottom: 8px; }
.mk-card h3 { font-size: 1.7rem; }
.mk-card .role { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.mk-card p { margin-inline: auto; color: var(--muted); font-size: 0.9375rem; }

.trib { margin: 0; }
.trib blockquote { margin: 0 0 12px; font-size: 1.0625rem; text-wrap: pretty; }
.trib blockquote::before { content: "\201C"; font-family: var(--display); font-size: 3rem; line-height: 0; color: var(--gold2); vertical-align: -0.4em; margin-right: 4px; }
.trib figcaption { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.trib figcaption b { color: var(--gold); font-weight: 500; }

.prog { list-style: none; margin: 0; padding: 0; }
.prog li { display: grid; grid-template-columns: 6.8rem 1fr; gap: 6px 22px; padding: 16px 0; border-top: 1px solid var(--line); align-items: baseline; }
.prog li:first-child { border-top: 0; }
.prog .t { font-family: var(--display); font-size: 2.3rem; font-weight: 600; color: var(--gold); line-height: 1; }
.prog h3 { font-size: 1.45rem; margin-bottom: 2px; }
.prog p { margin: 0; color: var(--muted); }
@media (max-width: 30rem) { .prog li { grid-template-columns: 1fr; } }

.menu { display: grid; gap: 22px; }
.menu h3 { font-size: 1.5rem; color: var(--gold); margin-bottom: 6px; }
.menu ul { list-style: none; margin: 0; padding: 0; }
.menu li { padding: 8px 0; border-top: 1px dotted var(--line); }
.menu li:first-child { border-top: 0; }
.menu li b { font-weight: 500; display: block; }
.menu li span { color: var(--muted); font-size: 0.9375rem; }

.planbox { overflow-x: auto; }
.plan { width: 100%; min-width: 520px; height: auto; display: block; }
.plan text { font-family: var(--body); font-size: 12px; fill: var(--fg); letter-spacing: 0.04em; }
.plan .sm { font-size: 10px; fill: var(--muted); }
.plan .room { fill: var(--panel2); stroke: var(--gold2); stroke-width: 1.2; }
.plan .out { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.plan .mez { fill: color-mix(in srgb, var(--wine) 60%, var(--panel)); stroke: var(--gold); stroke-width: 1.2; stroke-dasharray: 5 3; }

details.faq { border-top: 1px solid var(--line); padding: 14px 0; }
details.faq:last-of-type { border-bottom: 1px solid var(--line); }
details.faq summary { cursor: pointer; font-family: var(--display); font-size: 1.35rem; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; color: var(--gold); font-family: var(--body); }
details.faq[open] summary::after { content: "\2212"; }
details.faq p { margin: 10px 0 0; color: var(--muted); }

.lock { max-width: 30rem; }
.field { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.field input { flex: 1 1 12rem; min-width: 0; background: var(--bg); border: 1px solid var(--gold2); color: var(--fg); font: inherit; font-size: 1.0625rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 10px 14px; }
.btn { background: var(--gold); color: #1A0E08; border: 0; font: inherit; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 20px; cursor: pointer; }
.btn:disabled { opacity: 0.55; cursor: default; }
.err { color: var(--rose); margin-top: 10px; min-height: 1.5em; }
.tw { overflow-x: auto; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; min-width: 440px; background: var(--panel); }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
.photo { margin: 0; max-width: 46rem; background: #0b0509; border: 1px solid var(--gold2); padding: 8px 8px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
.photo svg { display: block; width: 100%; height: auto; }
.photo figcaption { padding: 10px 4px 12px; font-family: var(--display); font-style: italic; font-size: 1.1rem; line-height: 1.3; }
.photo figcaption span { display: block; font-family: var(--body); font-style: normal; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold2); margin-top: 3px; }
a.clip { display: block; text-decoration: none; color: var(--fg); }
a.clip:hover { border-color: var(--gold2); }
a.clip .more { display: inline-block; margin-top: 10px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.art .src { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.art > p { font-size: 1.0625rem; }
.art .photo { margin: 0 0 24px; max-width: 40rem; }
.gh { display: flex; align-items: center; gap: 20px; }
.gh svg { width: 96px; height: 96px; flex: none; overflow: visible; }
a.guest:hover { border-color: var(--gold2); }
.cipher { font-family: var(--display); font-size: clamp(2.4rem, 9vw, 3.6rem); letter-spacing: 0.3em; color: var(--gold); text-align: center; padding: 12px 0 8px; font-weight: 600; }
.alpha { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-bottom: 6px; color: var(--muted); font-size: 0.8125rem; }
.alpha span { width: 1.6rem; text-align: center; border-bottom: 1px solid var(--line); }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 0.8125rem; letter-spacing: 0.12em; text-transform: uppercase; }
</style>

</head>

  var ARTICLES = {
    vente: { src: "Le Courrier du Layon", date: "12 mai 2016", title: "Valmont change de mains", chapo: "La maison de liqueurs angevine, fondée en 1921, passe sous le contrôle du groupe Aubrière.", plate: null,
      body: ["C'est la fin d'une histoire familiale de quatre-vingt-quinze ans. La Maison Valmont, connue dans tout le Maine-et-Loire pour son Élixir des Rosiers, a annoncé hier la cession de l'ensemble de ses activités au groupe Aubrière. Selon des sources proches du dossier, l'opération porterait sur environ 38 millions d'euros.", "Les cent quarante salariés sont maintenus, et le nouveau propriétaire a promis de conserver la recette de l'Élixir ainsi que la distillerie d'Angers. « Nous reprenons une marque, mais surtout un savoir-faire », a déclaré son président lors d'une conférence de presse.", "Le produit de la vente sera réparti entre plusieurs héritiers de la famille, dont le plus jeune, Léo Valmont, 18 ans, n'a pas souhaité s'exprimer. Le Pavillon des Rosiers, résidence d'été construite en 1926, n'est pas concerné par l'accord. Il reste pour l'instant fermé."] },
    reouverture: { src: "L'Écho des Rosiers", date: "21 septembre 2018", title: "Le pavillon des Rosiers rouvre ses volets", chapo: "Deux ans après la vente de la maison de liqueurs, les héritiers remettent en état la résidence d'été des Valmont.", plate: "facade",
      body: ["Depuis le printemps, les camions de menuisiers et de peintres se succèdent route des Rosiers. Le pavillon, construit en 1926 pour recevoir les clients de la maison Valmont, avait été fermé à la vente de la distillerie. Il retrouve peu à peu ses parquets, ses miroirs et ses lustres d'origine.", "À la tête du chantier, Léo Valmont, 20 ans, étudiant en histoire de l'art, et sa sœur Éloïse, qui ont décidé de garder la maison. « Je ne veux pas en faire un musée, explique le jeune homme. Je veux qu'on y danse à nouveau. »", "Aucune date n'est encore fixée, mais le propriétaire laisse entendre qu'une fête pourrait avoir lieu pour la fin de l'année suivante. Les voisins, eux, sont partagés entre curiosité et inquiétude pour leurs soirées."] },
    premier: { src: "L'Écho des Rosiers", date: "3 janvier 2020", title: "Le bal dont on parle", chapo: "Vingt-quatre invités masqués ont dansé jusqu'à l'aube dans un pavillon des années 1920.", plate: "gramophone",
      body: ["Il y avait des plumes, des gants longs, des masques vénitiens et un gramophone, dans la nuit du 31 décembre, au Pavillon des Rosiers. Le jeune Léo Valmont, 21 ans, y recevait pour la première fois une vingtaine d'amis et de connaissances, pour un « bal des masques » à l'ancienne.", "Au programme : un buffet, des valses, et un jeu que l'hôte avait préparé en secret. Sept masques étaient cachés dans la maison, et une clé au fond du cornet du gramophone ouvrait un coffret. « Personne n'a trouvé le septième avant trois heures du matin », reconnaît-il en riant.", "Le maître des lieux promet de recommencer l'an prochain. Il a déjà choisi, dit-il, un thème. Il refuse d'en dire plus."] },
    automates: { src: "Le Courrier du Layon", date: "14 décembre 2022", title: "Les automates de Léo", chapo: "Des mannequins articulés dans la salle de bal : l'héritier des liqueurs d'Anjou prépare son bal le plus étrange.", plate: "salle",
      body: ["Les habitants de la route des Rosiers ont vu passer, la semaine dernière, un camion plein de mannequins en bois. Ils sont destinés au bal du 31 décembre, que Léo Valmont prépare depuis l'été. Cette année, il s'intitulera « Les Automates ».", "« Il faudra remonter quatre mécanismes dans le bon ordre pour ouvrir la porte du jardin, explique l'organisateur. Si on se trompe, la musique s'arrête. » Il refuse de dire combien de mannequins sont installés, mais promet que certains « parlent ».", "Léo Valmont, qui reçoit désormais une vingtaine d'invités chaque année, finance seul ses soirées. Les voisins, eux, dorment mal : le pavillon est éclairé jusqu'à l'aube."] },

        ed("2019", "Les Sept Masques", "Premier bal. Sept masques cachés dans la maison, une clé au fond du cornet d\'un gramophone. Personne n\'a trouvé le septième avant trois heures du matin.", "24 invités") +
        ed("2020", "Le Bal à distance", "Couvre-feu dès 20h : Léo organise le bal en visioconférence. Huit écrans, huit tenues, un jeu de piste dans les appartements de chacun.", "8 foyers") +
        ed("2021", "Les Illusionnistes", "Cartes truquées, boîte à double fond, et un invité qui a fait disparaître le gâteau. Le gâteau n\'a jamais reparu.", "16 invités") +
        ed("2022", "Les Automates", "Une salle de bal peuplée de mannequins articulés. Il fallait remonter quatre mécanismes dans l\'ordre pour ouvrir la porte du jardin.", "18 invités") +
        ed("2023", "Le Bal vénitien", "Masques de Venise, gondole en carton au milieu de la salle et indices à lire dans les reflets du grand miroir.", "20 invités") +
        ed("2024", "Le Bal des Archives", "Une bibliothèque, un coffre, et un livre dont une page ne disait pas la même chose que les autres.", "14 invités") +
        ed("2025", "Le Bal des Doubles", "Léo n\'avait invité que ses huit plus proches amis. Chacun arrivait sous le masque d\'un autre. La fête s\'est prolongée très tard dans la nuit. Le registre du portail a été numérisé le 2 janvier.", "8 invités") +
        '<li class="last"><div class="y">2026</div><div><h3>Le dernier bal</h3><p>Préparé par Léo jusqu\'au bout. Jeudi 31 décembre, dès 20h.</p><div class="meta"><a href="#programme">Voir le programme</a></div></div></li>' +
        '</ul>';
    },

    masques: function () {
      return '<p class="eyebrow">La collection</p><h2>Huit masques, huit caractères</h2>' +
        '<p class="lede">La commedia dell\'arte donne à chaque personnage un masque et un défaut. Léo en a choisi huit pour ses huit amis. À chacun d\'y reconnaître quelqu\'un.</p>' + orn() +
        '<div style="margin-bottom:18px">' + plate("masques", "Trois masques de la collection de Léo") + '</div><div class="grid g3">' + MASKS.map(function (m) {
          return '<article class="card mk-card">' + mask(m[0]) + '<h3>' + m[0] + '</h3><div class="role">' + m[1] + '</div><p>' + m[2] + '</p></article>';
        }).join("") + '</div>';
    },

    invites: function () {
      return '<p class="eyebrow">Les convives</p><h2>Les huit invités</h2>' +
        '<p class="lede">Ceux du bal de l\'an dernier, et ceux de ce soir. Léo avait choisi les masques lui-même, selon ce qu\'il pensait de chacun. Ouvrez une carte pour lire son histoire.</p>' + orn() +
        
        '<div class="grid g2">' + GUESTS.map(function (g) {
          return '<a class="card guest" href="#invite-' + GUEST_IDS[g[0]] + '" style="text-decoration:none;color:inherit">' + mask(g[2]) + '<div><div class="nm">' + g[0] + '</div><div class="mk">' + g[2] + ' · ' + g[1] + ' ans</div></div><p>' + g[3] + '</p><div class="since">' + g[4] + ' · Lire sa fiche →</div></a>';
        }).join("") + '</div>';
    },

    hommages: function () {
      return '<p class="eyebrow">Livre d\'or</p><h2>Hommages</h2>' +
        '<p class="lede">Les mots de ses amis, laissés entre le 14 et le 16 octobre.</p>' + orn() +
        '<div class="grid g2">' + TRIBUTES.map(function (t) {
          return '<figure class="card trib"><blockquote>' + t[3] + '</blockquote><figcaption><b>' + t[0] + '</b> · ' + t[1] + ' · ' + t[2] + '</figcaption></figure>';
        }).join("") + '</div>';
    },

    message: function () {
      var alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(function (c) { return "<span>" + c + "</span>"; }).join("");
      var head = '<p class="eyebrow">Un message de Léo</p><h2>Pour ceux qui savent lire</h2>' +
        '<p class="lede">Léo a enregistré quelques mots pour le dernier bal. Il ne s\'ouvre qu\'à celui qui sait lire ses messages, et pas avant le 26 décembre à 20h.</p>' + orn();
      if (teaser) return head + teaserHtml(teaser);
      return head + '<div id="msgbox"></div>';
    },

    carte: function () {
      return '<p class="eyebrow">Signée Sacha Marchetti</p><h2>La carte du bal</h2>' +
        '<p class="lede">Comme chaque année, des produits d\'Anjou, de quoi tenir jusqu\'à l\'aube et un verre pour minuit.</p>' + orn() +
        '<div style="margin-bottom:18px">' + plate("elixir") + '</div><div class="grid g2"><div class="card menu"><div><h3>À l\'arrivée</h3><ul>' +
        mi("L\'Élixir des Rosiers", "Le cocktail de la maison : liqueur d\'orange amère, crémant de Loire, glace pilée.") +
        mi("Rillauds d\'Anjou", "Glacés au miel, servis tièdes.") +
        mi("Fouaces fourrées", "Aux rillettes d\'oie et aux champignons.") +
        '</ul></div><div><h3>Le dîner</h3><ul>' +
        mi("Terrine de sandre au beurre blanc", "Pickles de rose et pain grillé.") +
        mi("Suprême de volaille de Loué", "Sauce au Savennières, légumes de la Loire.") +
        mi("Fromages d\'Anjou", "Crémet d\'Anjou, bûchette de chèvre, pain de seigle.") +
        '</ul></div></div>' +
        '<div class="card menu"><div><h3>Les douceurs</h3><ul>' +
        mi("Quernons d\'ardoise", "Le chocolat de la maison, croquant à l\'amande.") +
        mi("Poires tapées au vin", "Servies avec une crème légère à la vanille.") +
        mi("Gâteau du dernier bal", "Léo en aurait voulu un. Il ne disparaîtra pas cette année.") +
        '</ul></div><div><h3>Pour le toast</h3><ul>' +
        mi("Crémant de Loire brut", "À minuit, avec le verre de son voisin.") +
        mi("Coteaux du Layon", "Pour ceux qui préfèrent le doux.") +
        mi("Jus de pomme de Loire", "Pour les autres.") +
        '</ul></div></div></div>' +
        '<p class="muted" style="margin-top:16px">Une allergie, un régime ? Prévenez Sacha avant le 20 décembre.</p>';
    },

    programme: function () {
      return '<p class="eyebrow">Jeudi 31 décembre 2026</p><h2>Le dernier bal</h2>' +
        '<p class="lede">Pavillon des Rosiers, Anjou. Les horaires sont ceux de Léo : merci de ne pas les changer.</p>' + orn() +
        '<ol class="prog">' +
        pg("20h00", "Accueil", "Cocktail dans la salle de bal. Les masques sont remis à l\'arrivée.") +
        pg("21h00", "Dîner", "Buffet dînatoire, musique et retrouvailles.") +
        pg("22h20", "Le livret de Léo", "Ouverture du jeu. Il se joue ensemble et dure un peu moins de deux heures.") +
        pg("00h00", "Minuit", "Le toast. Les masques tombent.") +
        '</ol>' + orn() +
        '<div class="grid g2">' +
        '<div class="card"><div class="k">Tenue</div><p>Années 20. Smoking ou costume sombre, robe à franges, gants, bijoux de scène. Un masque vous sera remis à l\'arrivée.</p></div>' +
        '<div class="card"><div class="k">Pratique</div><p>Stationnement dans la cour du pavillon. Apportez un stylo, un smartphone chargé, de bonnes chaussures pour danser, et signez le registre en partant.</p></div>' +
        '</div>' +
        '<h3 class="sech">Questions fréquentes</h3>' +
        FAQ.map(function (f) { return '<details class="faq"><summary>' + f[0] + '</summary><p>' + f[1] + '</p></details>'; }).join("");
    },

    archives: function () {
      if (unlocked) return archiveHtml(unlocked);
      return '<p class="eyebrow">Accès réservé</p><h2>Archives</h2>' +
        '<p class="lede">Les registres du pavillon, numérisés par Léo. Ils sont réservés aux invités du dernier bal.</p>' + orn() +
        '<form class="card lock" id="lockform" autocomplete="off"><div class="k">Mot de passe</div>' +
        '<p class="muted" style="margin:0">Léo l\'a caché dans son jeu. Il se mérite.</p>' +
        '<div class="field"><input id="pw" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" aria-label="Mot de passe des archives" placeholder="Mot de passe"><button class="btn" id="go" type="submit">Ouvrir</button></div>' +
        '<div class="err" id="err" role="status"></div></form>';
    }
  };

  function archiveHtml(d) {
    var rows = d.lignes.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>"; }).join("");
    var hist = d.historique.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td></tr>"; }).join("");
    return '<p class="eyebrow">Archives ouvertes</p><h2>' + d.titre + '</h2><p class="muted" style="margin-top:8px">' + d.note + '</p>' + orn() +
      '<div class="tw"><table><thead><tr><th>Invité</th><th>Masque</th><th>Départ</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<h3 style="margin:34px 0 12px">Historique des modifications</h3>' +
      '<div class="tw"><table><thead><tr><th>Date</th><th>Compte</th><th>Action</th><th>Détail</th></tr></thead><tbody>' + hist + '</tbody></table></div>';
  }

  /* ---------- Composants ---------- */
  function orn() { return '<div class="orn" aria-hidden="true"><i></i></div>'; }
  function card(route, k, title, text) { return '<a class="card" href="#' + route + '"><div class="k">' + k + '</div><h3>' + title + '</h3><p class="muted">' + text + '</p></a>'; }
  function fact(k, v) { return "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>"; }
  function tl(y, t, text) { return '<li><div class="y">' + y + '</div><div><h3>' + t + "</h3><p>" + text + "</p></div></li>"; }
  function ed(y, t, text, meta) { return '<li><div class="y">' + y + '</div><div><h3>' + t + "</h3><p>" + text + '</p><div class="meta">' + meta + "</div></div></li>"; }
  function clip(src, title, text) { return '<div class="clip"><div class="src">' + src + "</div><h3>" + title + "</h3><p>" + text + "</p></div>"; }
  function pg(t, title, text) { return '<li><div class="t">' + t + "</div><div><h3>" + title + "</h3><p>" + text + "</p></div></li>"; }
  function mi(t, d) { return "<li><b>" + t + "</b><span>" + d + "</span></li>"; }
  function bigMask() {
    return '<svg class="hero-mask" viewBox="0 0 120 90" aria-hidden="true"><path d="M8 40 Q10 10 60 14 Q110 10 112 40 Q110 72 82 74 Q70 76 60 62 Q50 76 38 74 Q10 72 8 40Z" fill="#29152A" stroke="#E5C27D" stroke-width="2"/><path d="M14 30 Q60 18 106 30" fill="none" stroke="#A9854A" stroke-width="1"/><ellipse cx="38" cy="42" rx="13" ry="7.5" fill="#130810" stroke="#E5C27D" stroke-width="1.6"/><ellipse cx="82" cy="42" rx="13" ry="7.5" fill="#130810" stroke="#E5C27D" stroke-width="1.6"/><path d="M96 20 Q122 -6 116 40" fill="none" stroke="#E5C27D" stroke-width="2"/><path d="M100 24 Q112 8 112 28" fill="none" stroke="#EA86A2" stroke-width="1.6"/><path d="M52 62 L60 74 L68 62" fill="none" stroke="#A9854A" stroke-width="1.2"/></svg>';
  }
  function plan() {
    return '<svg class="plan" viewBox="0 0 640 360" role="img" aria-label="Plan du pavillon : la cour, le hall, la salle de bal avec sa mezzanine, la loge des artistes, l\'office et le jardin">' +
      '<rect class="out" x="6" y="6" width="628" height="348"/>' +
      '<rect class="room" x="30" y="40" width="360" height="220"/><text x="210" y="154" text-anchor="middle" font-size="15">Salle de bal</text><text class="sm" x="210" y="172" text-anchor="middle">parquet, miroirs, buffet</text>' +
      '<rect class="mez" x="30" y="40" width="360" height="42"/><text class="sm" x="210" y="65" text-anchor="middle">Mezzanine (galerie, accès fermé)</text>' +
      '<rect class="room" x="410" y="40" width="200" height="100"/><text x="510" y="86" text-anchor="middle">Loge des artistes</text><text class="sm" x="510" y="104" text-anchor="middle">miroirs, malles, costumes</text>' +
      '<rect class="room" x="410" y="160" width="200" height="100"/><text x="510" y="206" text-anchor="middle">Office</text><text class="sm" x="510" y="224" text-anchor="middle">cuisine de Sacha</text>' +
      '<rect class="room" x="150" y="260" width="120" height="50"/><text x="210" y="290" text-anchor="middle">Hall d\'entrée</text>' +
      '<rect class="out" x="30" y="318" width="580" height="28"/><text class="sm" x="320" y="336" text-anchor="middle">Cour et stationnement · portail et registre des départs</text>' +
      '<text class="sm" x="30" y="30">Jardin</text><text class="sm" x="560" y="30">Jardin</text>' +
      '</svg>';
  }

  function teaserHtml(t) {
    var video = TEASER_VIDEO ? '<video controls playsinline style="width:100%;max-width:46rem;margin-bottom:18px;border:1px solid var(--gold2)" src="' + TEASER_VIDEO + '"></video>' : "";
    return '<div class="card" style="max-width:46rem"><div class="k">' + t.titre + '</div>' + video + '<p class="muted" style="margin:0 0 14px">' + t.note + '</p><div class="stack">' +
      t.lignes.map(function (l) { return '<blockquote class="quote" style="font-size:1.6rem">' + l + '</blockquote>'; }).join("") + '</div></div>';
  }
  function cdText(ms) {
    var d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return d + " j " + h + " h " + m + " min";
  }
  function wireMessage() {
    var box = document.getElementById("msgbox"); if (!box) return;
    function tryOpen(pw, fromStore) {
      return openVault(pw, VAULT2).then(function (d) {
        lsSet("pdr-msg", pw);
        if (Date.now() >= OPEN_AT) { teaser = d; show(); return; }
        box.innerHTML = '<div class="card" style="max-width:34rem"><div class="k">Mot de passe accepté</div><p>Léo vous attend. Son message s\'ouvrira le 26 décembre à 20h00, dans <b id="cd">' + cdText(OPEN_AT - Date.now()) + '</b>.</p><p class="muted" style="margin:0">Revenez sur cette page à ce moment-là : vous n\'aurez pas à retaper le mot de passe.</p></div>';
        var iv = setInterval(function () { var el = document.getElementById("cd"); if (!el) { clearInterval(iv); return; } var left = OPEN_AT - Date.now(); if (left <= 0) { clearInterval(iv); tryOpen(pw, true); } else el.textContent = cdText(left); }, 1000);
      }, function (x) { if (!fromStore) throw x; drawForm(); });
    }
    function drawForm() {
      var alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(function (c) { return "<span>" + c + "</span>"; }).join("");
      box.innerHTML = '<form class="card lock" id="msgform" autocomplete="off" style="max-width:34rem"><div class="k">Mot de passe chiffré</div>' +
        '<p style="margin:0 0 10px">« J\'ai chiffré ce mot comme je chiffre tout : en décalant chaque lettre d\'autant de pas que j\'ai donné de bals. » <span class="muted">Léo</span></p>' +
        '<div class="cipher" aria-label="LUAYHJAL">LUAYHJAL</div>' +
        '<div class="alpha" aria-hidden="true">' + alpha + '</div>' +
        '<div class="field"><input id="mpw" type="text" spellcheck="false" autocapitalize="characters" aria-label="Mot de passe déchiffré" placeholder="Le mot déchiffré"><button class="btn" id="mgo" type="submit">Ouvrir</button></div><div class="err" id="merr" role="status"></div>' +
        '<details class="faq"><summary>Un indice</summary><p>Combien de bals Léo a-t-il donnés avant le dernier ? La page « Les bals » vous le dit.</p></details>' +
        '<details class="faq"><summary>Un autre indice</summary><p>Le texte a été décalé vers l\'avant dans l\'alphabet. Pour le lire, reculez d\'autant de pas.</p></details></form>';
      var f = document.getElementById("msgform"), err = document.getElementById("merr"), go = document.getElementById("mgo"), pw = document.getElementById("mpw");
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = normalize(pw.value); if (!v) { err.textContent = "Entrez le mot déchiffré."; return; }
        go.disabled = true; err.textContent = "";
        tryOpen(v, false).then(function () {}, function (x) { go.disabled = false; err.textContent = x && x.message === "nocrypto" ? "Ce navigateur ne peut pas ouvrir le message. Essayez-en un autre." : "Ce n'est pas le bon mot. Relisez le message de Léo."; pw.select(); });
      });
    }
    var saved = lsGet("pdr-msg");
    if (saved) tryOpen(saved, true); else drawForm();
  }

  /* ---------- Compte à rebours ---------- */
  var target = new Date(2026, 11, 31, 20, 0, 0).getTime(), timer = null;
  function tick() {
    var el = document.getElementById("count");
    if (!el) { clearInterval(timer); timer = null; return; }
    var t = target - Date.now();
    if (t <= 0) { el.textContent = "Le bal a lieu ce soir."; return; }
    var d = Math.floor(t / 864e5), h = Math.floor(t % 864e5 / 36e5), m = Math.floor(t % 36e5 / 6e4), sec = Math.floor(t % 6e4 / 1e3);
    el.innerHTML = box(d, d > 1 ? "jours" : "jour") + box(h, "heures") + box(m, "minutes") + box(sec, "secondes");
  }
  function box(n, l) { return "<div><b>" + n + "</b><span>" + l + "</span></div>"; }

  /* ---------- Navigation ---------- */
  var MENU = [
    ["accueil", "Accueil"],
    ["Léo", [["leo", "Portrait de Léo"], ["message", "Un message de Léo"], ["valmont", "Les Valmont et la presse"], ["hommages", "Hommages"]]],
    ["Le lieu", [["pavillon", "Le pavillon"], ["bals", "Les bals"], ["carte", "La carte"]]],
    ["Les invités", [["invites", "Les huit invités"], ["masques", "Les masques"]]],
    ["programme", "Programme"],
    ["archives", "Archives"]
  ];
  var ROUTES = [];
  MENU.forEach(function (m) { if (typeof m[1] === "string") ROUTES.push(m); else m[1].forEach(function (r) { ROUTES.push(r); }); });
  function renderNav(cur) {
    var nav = document.getElementById("nav");
    nav.innerHTML = MENU.map(function (m, i) {
      if (typeof m[1] === "string") return '<a href="#' + m[0] + '"' + (m[0] === cur ? ' aria-current="page"' : "") + ">" + m[1] + "</a>";
      var here = m[1].some(function (r) { return r[0] === cur; });
      return '<div class="grp"><button type="button" class="top' + (here ? " here" : "") + '" aria-expanded="false" aria-controls="sub' + i + '">' + m[0] + '</button><div class="sub" id="sub' + i + '">' +
        m[1].map(function (r) { return '<a href="#' + r[0] + '"' + (r[0] === cur ? ' aria-current="page"' : "") + ">" + r[1] + "</a>"; }).join("") + "</div></div>";
    }).join("");
  }
  (function wireNav() {
    var nav = document.getElementById("nav");
    function closeAll(except) { [].forEach.call(nav.querySelectorAll(".grp"), function (g) { if (g !== except) { g.classList.remove("open"); g.firstChild.setAttribute("aria-expanded", "false"); } }); }
    function open(g) {
      closeAll(g); g.classList.add("open"); g.firstChild.setAttribute("aria-expanded", "true");
      var sub = g.querySelector(".sub"); sub.classList.remove("r");
      if (g.getBoundingClientRect().left + sub.offsetWidth > document.documentElement.clientWidth - 8) sub.classList.add("r");
    }
    nav.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("button.top");
      if (b) { var g = b.parentNode; if (g.classList.contains("open")) closeAll(); else open(g); }
      else if (e.target.closest && e.target.closest(".sub a")) closeAll();
    });
    nav.addEventListener("mouseover", function (e) {
      if (!window.matchMedia || !window.matchMedia("(hover: hover)").matches) return;
      var g = e.target.closest && e.target.closest(".grp"); if (g && !g.classList.contains("open")) open(g);
    });
    nav.addEventListener("mouseleave", function () { if (window.matchMedia && window.matchMedia("(hover: hover)").matches) closeAll(); });
    document.addEventListener("click", function (e) { if (!nav.contains(e.target)) closeAll(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });
  })();
  function show() {
    var id = location.hash.replace("#", ""), navId, html, title;
    if (id.indexOf("invite-") === 0 && CARDS[id.slice(7)]) { navId = "invites"; html = guestHtml(id.slice(7)); title = GUESTS.filter(function (x) { return GUEST_IDS[x[0]] === id.slice(7); })[0][0]; }
    else if (id.indexOf("presse-") === 0 && ARTICLES[id.slice(7)]) { navId = "valmont"; html = articleHtml(id.slice(7)); title = ARTICLES[id.slice(7)].title; }
    else {
      if (!PAGES[id]) id = "accueil";
      navId = id; html = PAGES[id]();
      title = id === "accueil" ? "" : ROUTES.filter(function (r) { return r[0] === id; })[0][1];
    }
    document.getElementById("view").innerHTML = html;
    renderNav(navId);
    window.scrollTo(0, 0);
    document.title = title ? title + " · Pavillon des Rosiers" : "Pavillon des Rosiers";
    if (id === "accueil") { tick(); clearInterval(timer); timer = setInterval(tick, 1000); }
    if (id === "archives" && !unlocked) wireLock();
    if (id === "message" && !teaser) wireMessage();
  }
  function wireLock() {
    var form = document.getElementById("lockform"), err = document.getElementById("err"), go = document.getElementById("go"), pw = document.getElementById("pw");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = normalize(pw.value);
      if (!v) { err.textContent = "Entrez le mot de passe."; return; }
      go.disabled = true; err.textContent = "";
      openVault(v).then(function (d) { unlocked = d; show(); }, function (x) {
        go.disabled = false;
        err.textContent = x && x.message === "nocrypto" ? "Ce navigateur ne peut pas ouvrir les archives. Essayez-en un autre." : "Ce n'est pas le bon mot de passe.";
        pw.select();
      });
    });
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
